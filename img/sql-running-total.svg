<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 145" role="img" aria-labelledby="title desc">
  <title id="title">A running total across months</title>
  <desc id="desc">January has 27,004 departures. Adding February's 24,951 gives 51,955. Adding March's 28,834 gives 80,789.</desc>
  <rect width="760" height="145" fill="#fff"/>
  <g fill="#eef5fa" stroke="#315b78" stroke-width="2">
    <rect x="10" y="15" width="222" height="115" rx="8"/>
    <rect x="269" y="15" width="222" height="115" rx="8"/>
    <rect x="528" y="15" width="222" height="115" rx="8"/>
  </g>
  <g fill="#172f40" text-anchor="middle" font-family="sans-serif" font-size="18">
    <text x="121" y="43">January: 27,004</text>
    <text x="380" y="43">February: +24,951</text>
    <text x="639" y="43">March: +28,834</text>
    <text x="121" y="78">Running: 27,004</text>
    <text x="380" y="78">Running: 51,955</text>
    <text x="639" y="78">Running: 80,789</text>
    <text x="121" y="110" font-size="15">First month</text>
    <text x="380" y="110" font-size="15">January + February</text>
    <text x="639" y="110" font-size="15">January + February + March</text>
    <text x="250" y="80" font-size="26">→</text>
    <text x="509" y="80" font-size="26">→</text>
  </g>
</svg>
