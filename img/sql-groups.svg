<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Split, summarize, combine by origin</title>
  <desc id="desc">Four departures on January 1 scheduled by 05:50 keep their input order. EWR has UA 1545 with delay 2; LGA has UA 1714 with delay 4; JFK has AA 1141 with delay 2 and B6 725 with delay minus 1. Grouping gives EWR one departure and net delay 2, JFK two and net delay 1, LGA one and net delay 4.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526575"/></marker></defs>
  <rect width="1000" height="440" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172b3a">
    <g font-size="21" font-weight="bold"><text x="20" y="35">1. Split by origin</text><text x="365" y="35">2. Summarize</text><text x="685" y="35">3. Combine</text></g>
    <g font-size="16"><text x="20" y="65">Input rows stay in their order</text><text x="365" y="65">Count rows; add delays</text><text x="685" y="65">One result row per origin</text></g>
    <rect x="20" y="90" width="285" height="36" rx="4" fill="#e9edf1"/>
    <g font-size="16" font-weight="bold"><text x="32" y="114">Origin</text><text x="106" y="114">Flight</text><text x="235" y="114">Delay</text></g>
    <rect x="20" y="132" width="285" height="44" rx="4" fill="#dcecf9"/>
    <rect x="20" y="182" width="285" height="44" rx="4" fill="#fce9d4"/>
    <rect x="20" y="232" width="285" height="44" rx="4" fill="#dcefe6"/>
    <rect x="20" y="282" width="285" height="44" rx="4" fill="#dcefe6"/>
    <g font-size="18"><text x="32" y="160">EWR</text><text x="106" y="160">UA 1545</text><text x="250" y="160">2</text><text x="32" y="210">LGA</text><text x="106" y="210">UA 1714</text><text x="250" y="210">4</text><text x="32" y="260">JFK</text><text x="106" y="260">AA 1141</text><text x="250" y="260">2</text><text x="32" y="310">JFK</text><text x="106" y="310">B6 725</text><text x="243" y="310">−1</text></g>
    <path d="M315 208 H350" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="365" y="90" width="255" height="72" rx="6" fill="#dcecf9"/>
    <rect x="365" y="177" width="255" height="86" rx="6" fill="#dcefe6"/>
    <rect x="365" y="278" width="255" height="72" rx="6" fill="#fce9d4"/>
    <g font-size="18"><text x="380" y="117" font-weight="bold">EWR · 1 row</text><text x="380" y="144">Net delay: 2</text><text x="380" y="205" font-weight="bold">JFK · 2 rows</text><text x="380" y="239">Net delay: 2 + (−1) = 1</text><text x="380" y="305" font-weight="bold">LGA · 1 row</text><text x="380" y="332">Net delay: 4</text></g>
    <path d="M630 208 H670" stroke="#526575" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="685" y="90" width="295" height="36" rx="4" fill="#e9edf1"/>
    <g font-size="16" font-weight="bold"><text x="697" y="114">Origin</text><text x="780" y="114">Count</text><text x="860" y="114">Net delay</text></g>
    <rect x="685" y="132" width="295" height="44" rx="4" fill="#dcecf9"/>
    <rect x="685" y="182" width="295" height="44" rx="4" fill="#dcefe6"/>
    <rect x="685" y="232" width="295" height="44" rx="4" fill="#fce9d4"/>
    <g font-size="18"><text x="697" y="160">EWR</text><text x="795" y="160">1</text><text x="890" y="160">2</text><text x="697" y="210">JFK</text><text x="795" y="210">2</text><text x="890" y="210">1</text><text x="697" y="260">LGA</text><text x="795" y="260">1</text><text x="890" y="260">4</text></g>
    <g font-size="16"><text x="20" y="395">January 1, 2013 · scheduled departure time ≤ 550 · delay in minutes</text><text x="20" y="421">Groups describe shared values; they do not rearrange the stored table.</text></g>
  </g>
</svg>
