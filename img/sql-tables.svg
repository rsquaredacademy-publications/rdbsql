<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title description">
  <title id="title">The five flight database tables and their matching columns</title>
  <desc id="description">Flights connects to airlines by carrier, planes by tail number, airports by origin or destination and FAA code, and weather by origin and hour.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#345779" stroke-width="1.5"/></marker></defs>
  <rect width="1000" height="440" fill="white"/>
  <g fill="none" stroke="#345779" stroke-width="2" marker-end="url(#arrow)">
    <path d="M350 120 L125 300"/>
    <path d="M440 120 L370 300"/>
    <path d="M530 120 L615 300"/>
    <path d="M620 120 L860 300"/>
  </g>
  <g fill="#eef5fb" stroke="#345779" stroke-width="2">
    <rect x="280" y="20" width="400" height="100" rx="8"/>
    <rect x="20" y="300" width="210" height="110" rx="8"/>
    <rect x="265" y="300" width="210" height="110" rx="8"/>
    <rect x="510" y="300" width="210" height="110" rx="8"/>
    <rect x="755" y="300" width="210" height="110" rx="8"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#182d40">
    <g font-size="22" font-weight="bold">
      <text x="480" y="54">flights</text>
      <text x="125" y="332">airlines</text>
      <text x="370" y="332">planes</text>
      <text x="615" y="332">airports</text>
      <text x="860" y="332">weather</text>
    </g>
    <g font-size="17">
      <text x="480" y="83">one scheduled departure</text>
      <text x="125" y="362">one airline</text>
      <text x="125" y="389">key: carrier</text>
      <text x="370" y="362">one aircraft</text>
      <text x="370" y="389">key: tailnum</text>
      <text x="615" y="362">one airport</text>
      <text x="615" y="389">key: faa</text>
      <text x="860" y="362">one origin and hour</text>
      <text x="860" y="389">origin + time_hour</text>
    </g>
  </g>
  <g fill="white">
    <rect x="165" y="201" width="100" height="26"/>
    <rect x="353" y="201" width="90" height="26"/>
    <rect x="483" y="201" width="184" height="26"/>
    <rect x="663" y="201" width="180" height="26"/>
  </g>
  <g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#182d40">
    <text x="215" y="220">carrier</text>
    <text x="398" y="220">tailnum</text>
    <text x="575" y="220">origin or dest = faa</text>
    <text x="753" y="220">origin + time_hour</text>
  </g>
</svg>
