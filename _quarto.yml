project:
  type: book
  output-dir: docs
  resources:
    - "google02e424888b5e2def.html"
    - "robots.txt"
    - "_redirects"
    - "404.html"
    - site-kit

execute:
  warning: false

quarto-required: ">=1.10.0"

sitemap: true

book:
  title: "R, Databases & SQL"
  author: "Aravind Hebbali"
  date: last-modified
  description: "R DBI tutorial: connect R to SQLite, query with dbplyr and SQL — free 2-hour primer before R4DS."
  chapters:
    - index.qmd
    - about.qmd
    - dbi.qmd
    - dbplyr.qmd
    - sql-basics.qmd
    - sql-advanced.qmd
    - joins.qmd
    - cheatsheet.qmd
  appendices:
    - production.qmd
    - duckdb.qmd
  downloads: [pdf, epub]
  # Filename for the whole-book PDF/ePub. Must be set here rather than renamed
  # after the render: Quarto bakes this name into the landing page's download
  # link, so a post-render rename leaves the advertised button 404ing.
  output-file: "databases-and-sql"
  page-footer:
    center: |
      We use Google Analytics 4 to understand how people use this site (pages visited, referring sites, device type and approximate location) so we can improve our free learning material. Google Analytics uses cookies and a pseudonymous identifier; we don't use it for advertising and we never send Google names or email addresses. Visitors in the European Economic Area, the United Kingdom and Switzerland are asked for consent first, and if they decline, no analytics cookies are stored. Anyone can switch analytics off at any time: <a href="#" data-rsa-analytics-optout>Turn off analytics</a>.

      Sites that show the newsletter sign-up form use Zoho Campaigns to send updates. If you sign up, we collect your email address, an optional first name, and which site you signed up on, and we use them only to send you updates. Sign-up uses double opt-in, so you must confirm by email before you are added; every email includes an unsubscribe link, and we never sell or share the list.

website:
  site-url: https://rdbsql.rsquaredacademy.com
  repo-url: https://github.com/rsquaredacademy-publications/rdbsql/
  description: "R DBI tutorial: connect R to SQLite, query with dbplyr and SQL — free 2-hour primer before R4DS."
  open-graph: true
  twitter-card: true
  navbar:
    right:
      - text: "GitHub"
        href: https://github.com/rsquaredacademy-publications/rdbsql/

format:
  html:
    theme: cosmo
    css: style.css
    toc: true
    toc-depth: 3
    search: true
    code-copy: true
    code-overflow: wrap
    filters:
      - includes/rsa-signup.lua
    include-in-header:
      - includes/site-kit-head.html
  pdf:
    documentclass: book
    toc-depth: 3
    pdf-engine: typst
    papersize: us-letter
    keep-typ: false
    code-overflow: wrap
    mainfont: "Linux Libertine"
    monofont: "DejaVu Sans Mono"
    number-sections: true
  epub:
    toc-depth: 2
    epub-chapter-level: 1
    cover-image: img/rdbsql.png
