name: Link check

# Weekly, separate from the build. The build's own link check is advisory and
# runs on pre-deploy output; this one fails on the deployed site so a link that
# rots between deploys is still caught.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check links in built site
        uses: lycheeverse/lychee-action@v2
        with:
          # reddit.com, stackoverflow.com and community.posit.co answer 403 to bots, so their failures are not real 404s.
          args: --verbose --no-progress --root-dir '${{ github.workspace }}/docs' './docs/**/*.html' --exclude 'mailto:' --exclude 'reddit\.com' --exclude 'stackoverflow\.com' --exclude 'community\.posit\.co'
          fail: true